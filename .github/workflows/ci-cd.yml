name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: mysql://ugsl:ugsl@127.0.0.1:3306/ugsl_test
      JWT_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:4000/graphql
      VITE_API_BASE_URL: http://127.0.0.1:4000
      VITE_GRAPHQL_URL: http://127.0.0.1:4000/graphql
      VITE_APP_API_URL: http://127.0.0.1:4000
      VITE_APP_NAME: ugsl-learn-admin
      VITE_APP_VERSION: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd packages/server db:generate

      - name: Test API
        run: bun run --cwd packages/server test

      - name: Build learner web app
        run: bun run --cwd packages/client build

      - name: Build admin app
        run: bun run --cwd packages/client-admin build

  publish:
    name: Publish ${{ matrix.target }} image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, admin]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize image repository
        id: repo
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository }}-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.repository }}-${{ matrix.target }}:latest
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=${{ vars.PRODUCTION_GRAPHQL_URL || 'https://api.staging.8jobspot.com/graphql' }}
            VITE_API_BASE_URL=${{ vars.PRODUCTION_API_URL || 'https://api.staging.8jobspot.com' }}
            VITE_GRAPHQL_URL=${{ vars.PRODUCTION_GRAPHQL_URL || 'https://api.staging.8jobspot.com/graphql' }}
            VITE_APP_API_URL=${{ vars.PRODUCTION_API_URL || 'https://api.staging.8jobspot.com' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy production
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment definition
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Apply migrations and deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' sh ./deploy.sh"
