name: ugsl-learn

services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ugsl_learn}
      MARIADB_USER: ${DB_USER:-ugsl}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploaded-media:/app/packages/server/public
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

  web:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  admin:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"

volumes:
  database-data:
  uploaded-media:
